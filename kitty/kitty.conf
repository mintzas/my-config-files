# ============================================================
# Kitty Configuration
# ============================================================

# Keep the current general text size.
font_size 11.0

# Keep more terminal history than Kitty's default.
scrollback_lines 10000

# Kitty/Zsh integration enables useful features such as
# prompt navigation and command-output awareness.
shell_integration enabled

# Ask before closing a Kitty window when something is running.
confirm_os_window_close -1
